protocol: openai_responses
model: gpt-4.1-mini
base_url: https://dgi.deepexi.com/v1/
api_key: 222222
tool_timeout_seconds: 120.0
compact:
  context_window_tokens: 128000

sub_agent:
  models:
    haiku: gpt-4.1-mini
    sonnet: gpt-4.1-mini
    opus: gpt-4.1-mini

# Agent Team 默认由根 Agent 作为唯一 Team Lead；成员必须通过 team_member_spawn 创建。
# 团队日志只记录中文摘要、ID 和阶段上下文，不完整记录提示词、任务正文、环境变量或密钥。
team:
  max_members: 16
  max_active_members: 4
  backend_priority:
    - tmux
    - terminal
    - in_process
  coordinator_capability_enabled: false
  graceful_shutdown_timeout_seconds: 10.0
