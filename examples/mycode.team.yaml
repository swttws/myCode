protocol: openai_responses
model: your-openai-model
base_url: https://api.openai.com/v1
api_key: ${OPENAI_API_KEY}
compact:
  context_window_tokens: 128000
sub_agent:
  models:
    haiku: your-openai-model
    sonnet: your-openai-model
    opus: your-openai-model

# Agent Team 默认由根 Agent 作为唯一 Team Lead；成员必须通过 team_member_spawn 创建。
# 团队日志只记录中文摘要、ID 和阶段上下文，不完整记录提示词、任务正文、环境变量或密钥。
team:
  max_members: 16
  max_active_members: 4
  backend_priority:
    - in_process
    - tmux
    - terminal
  # 默认关闭 worker 侧协调者能力；根 Lead 始终按协调者模式运行。
  coordinator_capability_enabled: false
  graceful_shutdown_timeout_seconds: 10.0
